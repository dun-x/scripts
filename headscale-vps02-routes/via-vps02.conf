# Domains are resolved to IPv4 /32 routes every time the scripts run.
DOMAIN=makeuseof.com
DOMAIN=www.makeuseof.com

DOMAIN=androidpolice.com
DOMAIN=www.androidpolice.com

DOMAIN=howtogeek.com
DOMAIN=www.howtogeek.com

# Static IP/CIDR routes to send via vps02.
# Use /32 for a single IPv4.
# ROUTE=54.157.137.27/32
# ROUTE=1.2.3.4/32
# ROUTE=8.8.8.0/24

# Existing routes that vps02 must keep advertising, if any.
# These are included by update-vps02-routes.sh but ignored by approve-vps02-routes.sh
# unless also listed as ROUTE.
# EXTRA_ROUTE=192.168.50.0/24
